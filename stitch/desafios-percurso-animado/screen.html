<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#0061a2",
                    "secondary": "#5e41d0",
                    "tertiary": "#845400",
                    "surface": "#f7fafd",
                    "surface-variant": "#e0e3e6",
                    "on-surface": "#181c1e",
                    "on-surface-variant": "#404751",
                    "primary-container": "#4da9ff",
                    "secondary-container": "#775ceb",
                    "surface-container-low": "#f1f4f7",
                    "surface-container": "#ebeef1",
                    "outline-variant": "#c0c7d3",
                    "raspberry": "#0061a2",
                    "papaya": "#5e41d0",
                    "ice-cream": "#9dcaff",
                    "meadow": "#A8BF8A",
                    "sunshine": "#ffddb6",
                    "spring-sky": "#4da9ff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "xs": "8px",
                    "gutter": "16px",
                    "xl": "64px",
                    "base": "4px",
                    "sm": "16px",
                    "margin": "24px",
                    "lg": "40px"
            },
            "fontFamily": {
                    "label-sm": ["Plus Jakarta Sans"],
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "label-bold": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "h3": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "h2": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .bouncy-hover { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy-hover:hover { transform: scale(1.05); }
        body { min-height: 100dvh; }
        
        /* Ambient decoration animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating { animation: float 6s ease-in-out infinite; }
        .floating-delayed { animation: float 8s ease-in-out 1s infinite; }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface selection:bg-primary-container/30">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-white/70 backdrop-blur-md border-b border-white/20 shadow-sm">
<div class="flex items-center gap-2">
<span class="text-primary font-black tracking-tight text-xl font-['Plus_Jakarta_Sans']">Destravar</span>
</div>
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-2xl" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
</button>
</div>
</header>
<main class="relative min-h-screen pt-28 pb-56 overflow-hidden bg-gradient-to-b from-surface to-surface-container-low">
<!-- Background Environment Elements -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<!-- Soft Clouds -->
<div class="absolute top-32 left-[10%] floating text-primary/10">
<span class="material-symbols-outlined text-[80px]" style="font-variation-settings: 'FILL' 1;">cloud</span>
</div>
<div class="absolute top-96 right-[15%] floating-delayed text-secondary/10">
<span class="material-symbols-outlined text-[60px]" style="font-variation-settings: 'FILL' 1;">cloud</span>
</div>
<div class="absolute top-[600px] left-[5%] floating text-primary/10">
<span class="material-symbols-outlined text-[70px]" style="font-variation-settings: 'FILL' 1;">cloud</span>
</div>
<!-- Pine Trees & Bushes along the path area -->
<!-- Group 1 -->
<div class="absolute top-[250px] left-[15%] flex flex-col items-center text-primary/15">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">park</span>
</div>
<!-- Group 2 -->
<div class="absolute top-[480px] right-[10%] text-primary/15">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">park</span>
</div>
<!-- Group 3 -->
<div class="absolute top-[750px] left-[12%] text-secondary/15">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">park</span>
</div>
<!-- Group 4 -->
<div class="absolute top-[950px] right-[12%] text-primary/15">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">park</span>
</div>
</div>
<!-- Learning Path SVG Layer -->
<div class="absolute inset-0 flex justify-center pointer-events-none">
<svg class="w-full h-full max-w-md overflow-visible" fill="none" viewbox="0 0 400 1200" xmlns="http://www.w3.org/2000/svg">
<path class="opacity-10" d="M200 0 C 350 150, 50 300, 200 450 C 350 600, 50 750, 200 900 C 350 1050, 50 1200, 200 1350" stroke="url(#gradient-path)" stroke-linecap="round" stroke-width="32"></path>
<defs>
<lineargradient id="gradient-path" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#0061a2"></stop>
<stop offset="50%" stop-color="#5e41d0"></stop>
<stop offset="100%" stop-color="#4da9ff"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- Interactive Map Container -->
<div class="relative z-10 max-w-md mx-auto flex flex-col items-center gap-20 px-8">
<!-- Node 1: Completed -->
<div class="relative group">
<div class="w-20 h-20 bg-secondary rounded-full flex items-center justify-center shadow-lg shadow-secondary/30 bouncy-hover cursor-pointer border-4 border-white">
<span class="material-symbols-outlined text-white text-3xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm text-[10px] font-bold text-secondary uppercase tracking-wider whitespace-nowrap">Aventura Inicial</div>
</div>
<!-- Node 2: Completed -->
<div class="relative group translate-x-20">
<div class="w-20 h-20 bg-secondary rounded-full flex items-center justify-center shadow-lg shadow-secondary/30 bouncy-hover cursor-pointer border-4 border-white">
<span class="material-symbols-outlined text-white text-3xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Node 3: Active (Começar) -->
<div class="relative group -translate-x-12">
<!-- Tooltip -->
<div class="absolute -top-14 left-1/2 -translate-x-1/2 bg-primary text-white px-5 py-2 rounded-full shadow-xl shadow-primary/30 whitespace-nowrap animate-bounce flex items-center gap-1 z-20">
<span class="font-label-bold text-label-bold">Começar</span>
<span class="material-symbols-outlined text-lg" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<!-- Node Body -->
<div class="w-24 h-24 bg-primary text-white rounded-full flex items-center justify-center shadow-2xl shadow-primary/40 bouncy-hover cursor-pointer border-8 border-primary-container/30">
<span class="material-symbols-outlined text-4xl" data-icon="extension" style="font-variation-settings: 'FILL' 1;">extension</span>
</div>
<!-- Sparkle icon -->
</div>
<!-- Node 4: Locked -->
<div class="relative group translate-x-16">
<div class="w-16 h-16 bg-surface-variant text-on-surface-variant rounded-full flex items-center justify-center shadow-md border-4 border-outline-variant/60 bouncy-hover cursor-not-allowed">
<span class="material-symbols-outlined text-2xl" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<!-- Node 5: Locked -->
<div class="relative group -translate-x-4">
<div class="w-16 h-16 bg-surface-variant text-on-surface-variant rounded-full flex items-center justify-center shadow-md border-4 border-outline-variant/60 bouncy-hover cursor-not-allowed">
<span class="material-symbols-outlined text-2xl" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<!-- Node 6: Locked / Treasure Chest -->
<div class="relative group translate-x-12">
<div class="w-24 h-24 bg-surface-container-low rounded-full flex items-center justify-center shadow-inner border-4 border-dashed border-outline-variant bouncy-hover cursor-not-allowed">
<span class="material-symbols-outlined text-4xl text-on-surface-variant/40" data-icon="featured_seasonal_and_gifts">featured_seasonal_and_gifts</span>
</div>
</div>
</div>
<!-- Progress Metrics (Fixed above Bottom Bar) -->
<div class="fixed bottom-32 left-0 right-0 z-40 px-6 max-w-md mx-auto">
<div class="glass-card rounded-2xl p-4 shadow-xl shadow-primary/5 flex items-center justify-between gap-4">
<!-- XP Metric -->
<div class="flex-1 flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<span class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">XP Hoje</span>
<span class="text-label-sm font-label-bold text-primary">120 / 300</span>
</div>
<div class="h-2.5 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[40%] rounded-full shadow-[0_0_8px_rgba(0,97,162,0.3)]"></div>
</div>
</div>
<!-- Separator -->
<div class="w-px h-10 bg-outline-variant/30"></div>
<!-- Streak Metric -->
<div class="flex items-center gap-3 px-2">
<div class="flex flex-col items-end">
<span class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">Streak</span>
<span class="text-2xl font-black text-secondary leading-none">12</span>
</div>
<div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-2xl" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center max-w-md mx-auto px-4 pb-8 pt-4 bg-white/80 backdrop-blur-xl rounded-t-[40px] border-t border-white/30 shadow-[0_-10px_40px_rgba(0,97,162,0.1)]">
<!-- Desafios (Active) -->
<a class="flex flex-col items-center justify-center rounded-full py-2 px-6 active:scale-95 transition-all duration-200 bg-primary/10 text-primary" href="#">
<span class="material-symbols-outlined" data-icon="extension" style="font-variation-settings: 'FILL' 1;">extension</span>
<span class="font-label-bold text-[11px] mt-0.5">Desafios</span>
</a>
<!-- Ranking -->
<a class="flex flex-col items-center justify-center text-on-surface-variant/50 py-2 px-4 hover:bg-primary/5 rounded-full transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-bold text-[11px] mt-0.5">Ranking</span>
</a>
<!-- Perfil -->
<a class="flex flex-col items-center justify-center text-on-surface-variant/50 py-2 px-4 hover:bg-primary/5 rounded-full transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-bold text-[11px] mt-0.5">Perfil</span>
</a>
</nav>
</body></html>
