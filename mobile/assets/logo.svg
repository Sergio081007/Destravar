<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: azul → roxo -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0061a2"/>
      <stop offset="100%" stop-color="#5e41d0"/>
    </linearGradient>
    <!-- Brilho suave no canto superior esquerdo -->
    <radialGradient id="sheen" cx="30%" cy="20%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Corpo do cadeado: branco → azul bem suave (dá profundidade) -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf2fb"/>
    </linearGradient>
    <!-- Buraco da chave: degradê do tom do app -->
    <linearGradient id="keyhole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9dcaff"/>
      <stop offset="100%" stop-color="#4da9ff"/>
    </linearGradient>
    <!-- Halo do gancho solto (efeito de desbloqueio) -->
    <radialGradient id="unlockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4da9ff" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#4da9ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4da9ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra do corpo -->
    <filter id="bodyShadow" x="-12%" y="-8%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,40,110,0.22)"/>
    </filter>
  </defs>

  <!-- ═══ FUNDO ═══════════════════════════════════════════════ -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- ═══ SOMBRA PROJETADA DO CADEADO ═════════════════════════ -->
  <ellipse cx="256" cy="464" rx="116" ry="12" fill="rgba(0,20,60,0.22)"/>

  <!-- ═══ GANCHO (ARCO + BRAÇOS) ══════════════════════════════ -->

  <!-- Profundidade do gancho — traço levemente maior e escuro desenhado antes -->
  <line x1="176" y1="274" x2="176" y2="168"
        stroke="rgba(0,50,130,0.14)" stroke-width="42" stroke-linecap="round"/>
  <path d="M 176,168 A 80,80 0 0 0 336,168"
        stroke="rgba(0,50,130,0.14)" stroke-width="42"
        stroke-linecap="round" fill="none"/>
  <line x1="336" y1="168" x2="336" y2="232"
        stroke="rgba(0,50,130,0.14)" stroke-width="42" stroke-linecap="round"/>

  <!-- Gancho principal (branco) -->
  <line x1="176" y1="274" x2="176" y2="168"
        stroke="white" stroke-width="34" stroke-linecap="round"/>
  <path d="M 176,168 A 80,80 0 0 0 336,168"
        stroke="white" stroke-width="34"
        stroke-linecap="round" fill="none"/>
  <!-- Braço direito SOLTO — não entra no cadeado (desbloqueado) -->
  <line x1="336" y1="168" x2="336" y2="232"
        stroke="white" stroke-width="34" stroke-linecap="round"/>

  <!-- Reflexo especular no gancho (brilho metálico) -->
  <line x1="176" y1="268" x2="176" y2="168"
        stroke="rgba(255,255,255,0.45)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 176,168 A 80,80 0 0 0 336,168"
        stroke="rgba(255,255,255,0.45)" stroke-width="12"
        stroke-linecap="round" fill="none"/>
  <line x1="336" y1="168" x2="336" y2="232"
        stroke="rgba(255,255,255,0.45)" stroke-width="12" stroke-linecap="round"/>

  <!-- ═══ CORPO DO CADEADO ══════════════════════════════════════ -->
  <rect x="108" y="272" width="296" height="180" rx="40"
        fill="url(#bodyGrad)" filter="url(#bodyShadow)"/>

  <!-- Faixa superior do corpo (área de entrada do gancho) -->
  <rect x="108" y="272" width="296" height="50" rx="40"
        fill="rgba(0,97,162,0.045)"/>
  <!-- Linha separadora da faixa -->
  <line x1="134" y1="322" x2="378" y2="322"
        stroke="rgba(0,97,162,0.09)" stroke-width="1.5"/>

  <!-- Encaixes do gancho no corpo (buracos de entrada) -->
  <circle cx="176" cy="272" r="22" fill="rgba(0,97,162,0.07)"/>
  <circle cx="336" cy="272" r="22" fill="rgba(0,97,162,0.07)"/>

  <!-- Detalhe: parafusos nos cantos inferiores (acabamento industrial) -->
  <circle cx="156" cy="426" r="9"   fill="rgba(0,97,162,0.09)"/>
  <circle cx="156" cy="426" r="4.5" fill="rgba(0,97,162,0.11)"/>
  <line x1="151" y1="426" x2="161" y2="426" stroke="rgba(0,97,162,0.08)" stroke-width="1.2"/>
  <line x1="156" y1="421" x2="156" y2="431" stroke="rgba(0,97,162,0.08)" stroke-width="1.2"/>

  <circle cx="356" cy="426" r="9"   fill="rgba(0,97,162,0.09)"/>
  <circle cx="356" cy="426" r="4.5" fill="rgba(0,97,162,0.11)"/>
  <line x1="351" y1="426" x2="361" y2="426" stroke="rgba(0,97,162,0.08)" stroke-width="1.2"/>
  <line x1="356" y1="421" x2="356" y2="431" stroke="rgba(0,97,162,0.08)" stroke-width="1.2"/>

  <!-- ═══ BURACO DA CHAVE (KEYHOLE) ═══════════════════════════ -->
  <!-- Círculo superior -->
  <circle cx="256" cy="358" r="25" fill="url(#keyhole)" opacity="0.8"/>
  <!-- Slot inferior em forma de triângulo arredondado -->
  <rect x="247" y="373" width="18" height="38" rx="7"
        fill="url(#keyhole)" opacity="0.8"/>

  <!-- ═══ EFEITO DE DESBLOQUEIO NO BRAÇO SOLTO ════════════════ -->

  <!-- Halo externo -->
  <circle cx="336" cy="232" r="38" fill="url(#unlockGlow)"/>
  <!-- Círculo branco interno -->
  <circle cx="336" cy="232" r="15" fill="rgba(255,255,255,0.94)"/>
  <!-- Ponto de acento azul -->
  <circle cx="336" cy="232" r="6.5" fill="#4da9ff"/>

  <!-- Faíscas radiando do ponto solto (momentos de desbloqueio) -->
  <line x1="351" y1="217" x2="364" y2="204"
        stroke="#4da9ff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="358" y1="232" x2="374" y2="232"
        stroke="#4da9ff" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="351" y1="247" x2="364" y2="260"
        stroke="#4da9ff" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="336" y1="254" x2="336" y2="270"
        stroke="#4da9ff" stroke-width="3"   stroke-linecap="round" opacity="0.35"/>
</svg>
